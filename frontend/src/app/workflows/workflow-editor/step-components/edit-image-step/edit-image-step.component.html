<div class="step-card edit-image" [formGroup]="stepForm">
  <div class="step-header" (click)="isCollapsed = !isCollapsed">
    <div class="step-title">
      <mat-icon>auto_fix_high</mat-icon>
      <span>Edit Image</span>
      <span class="step-id-subtle">#{{ stepIndex + 1 }}</span>
    </div>
    <div class="step-actions">
      <button *ngIf="mode !== 'run'" mat-icon-button color="warn"
              (click)="$event.stopPropagation(); delete.emit()" matTooltip="Delete step">
        <mat-icon>delete</mat-icon>
      </button>
      <button mat-icon-button class="collapse-icon">
        <mat-icon>{{ isCollapsed ? 'expand_more' : 'expand_less' }}</mat-icon>
      </button>
    </div>
  </div>

  <div class="step-body" *ngIf="!isCollapsed">
    <div class="section inputs" formGroupName="inputs">
      <h3>Inputs</h3>
      <div class="input-group">
        <label>Input Image</label>
        <div class="controls-row">
           <mat-form-field appearance="outline" class="mode-select">
            <mat-select [value]="inputModes['input_images']" (selectionChange)="toggleInputMode('input_images', $event.value)">
              <mat-option value="fixed">Fixed</mat-option>
              <mat-option value="linked">Link</mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field *ngIf="inputModes['input_images'] === 'fixed'" appearance="outline" class="value-input">
            <input matInput formControlName="input_images" placeholder="Image URL...">
          </mat-form-field>
          <mat-form-field *ngIf="inputModes['input_images'] === 'linked'" appearance="outline" class="value-input">
             <mat-select formControlName="input_images">
              <mat-option *ngFor="let out of availableOutputs" [value]="{ step: out.step_id, output: out.output_key }">
                {{ out.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div class="input-group">
        <label>Edit Prompt</label>
        <div class="controls-row">
           <mat-form-field appearance="outline" class="mode-select">
            <mat-select [value]="inputModes['prompt']" (selectionChange)="toggleInputMode('prompt', $event.value)">
              <mat-option value="fixed">Fixed</mat-option>
              <mat-option value="linked">Link</mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field *ngIf="inputModes['prompt'] === 'fixed'" appearance="outline" class="value-input">
            <input matInput formControlName="prompt" placeholder="Describe changes...">
          </mat-form-field>
          <mat-form-field *ngIf="inputModes['prompt'] === 'linked'" appearance="outline" class="value-input">
             <mat-select formControlName="prompt">
              <mat-option *ngFor="let out of availableOutputs" [value]="{ step: out.step_id, output: out.output_key }">
                {{ out.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </div>

    <div class="section settings" formGroupName="settings">
      <h3>Settings</h3>
      <div class="settings-grid">
         <mat-form-field appearance="outline">
          <mat-label>Model</mat-label>
          <mat-select formControlName="model">
            <mat-option value="imagen-3.0-generate-001">Imagen 3.0</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="checkbox-group">
           <mat-checkbox formControlName="brand_guidelines">Use Brand Guidelines</mat-checkbox>
        </div>
      </div>
    </div>

    <div class="section outputs">
      <h3>Outputs</h3>
      <div class="output-pill"><mat-icon>image</mat-icon> edited_image</div>
    </div>
  </div>
</div>
