<div class="step-card generate-text" [formGroup]="stepForm">
  <div class="step-header" (click)="isCollapsed = !isCollapsed">
    <div class="step-title">
      <mat-icon>edit_note</mat-icon>
      <span>Generate Text</span>
      <span class="step-id-subtle">#{{ stepIndex + 1 }}</span>
    </div>
    <div class="step-actions">
      <button *ngIf="mode !== 'run'" mat-icon-button color="warn"
              (click)="$event.stopPropagation(); delete.emit()" matTooltip="Delete step">
        <mat-icon>delete</mat-icon>
      </button>
      <button mat-icon-button class="collapse-icon">
        <mat-icon>{{ isCollapsed ? 'expand_more' : 'expand_less' }}</mat-icon>
      </button>
    </div>
  </div>

  <div class="step-body" *ngIf="!isCollapsed">
    <div class="section inputs" formGroupName="inputs">
      <h3>Inputs</h3>
      <div class="input-group">
        <label>Prompt</label>
        <div class="controls-row">
          <mat-form-field appearance="outline" class="mode-select">
            <mat-select [value]="inputModes['prompt']" (selectionChange)="toggleInputMode('prompt', $event.value)">
              <mat-option value="fixed">Fixed</mat-option>
              <mat-option value="linked">Link</mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field *ngIf="inputModes['prompt'] === 'fixed'" appearance="outline" class="value-input">
            <textarea matInput formControlName="prompt" placeholder="Enter your prompt here..." rows="3"></textarea>
          </mat-form-field>
          <mat-form-field *ngIf="inputModes['prompt'] === 'linked'" appearance="outline" class="value-input">
            <mat-select formControlName="prompt">
              <mat-option *ngFor="let out of availableOutputs" [value]="{ step: out.step_id, output: out.output_key }">
                {{ out.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </div>

    <div class="section settings" formGroupName="settings">
      <h3>Settings</h3>
      <div class="settings-grid">
        <mat-form-field appearance="outline">
          <mat-label>Model</mat-label>
          <mat-select formControlName="model">
            <mat-option value="gemini-2.5-pro">Gemini 2.5 Pro</mat-option>
            <mat-option value="gemini-2.5-flash">Gemini 2.5 Flash</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Temperature ({{ stepForm.get('settings.temperature')?.value }})</mat-label>
          <input matInput type="number" formControlName="temperature" min="0" max="1" step="0.1">
        </mat-form-field>
      </div>
    </div>

    <div class="section outputs">
      <h3>Outputs</h3>
      <div class="output-pill"><mat-icon>text_fields</mat-icon> generated_text</div>
    </div>
  </div>
</div>
