<app-workspace-switcher></app-workspace-switcher>

<div class="mat-menu-floating fixed bg-gradient-to-b from-zinc-500/50 to-neutral-700/20 rounded-[48px] shadow-[2px_2px_12px_0px_rgba(0,0,0,0.10)] outline outline-1 outline-offset-[-1px] outline-stone-300/80 backdrop-blur-[10px] z-[100]">

  <!-- User avatar -->
  <div
    [matTooltip]="'Hey there ' + (currentUser?.name?.split(' ')?.[0] || '') + '!'"
    matTooltipPosition="right"
    class="relative md:mb-[10px] w-14 h-14 bg-blend-soft-light bg-white/40 rounded-[48px] shadow-[0px_4px_4px_0px_rgba(0,0,0,0.25)] backdrop-blur-2xl flex items-center justify-center overflow-hidden"
  >
    <img *ngIf="currentUser?.picture; else placeholder"
      [src]="currentUser?.picture"
      alt="User profile"
      class="w-full h-full object-cover"
    />
    <ng-template #placeholder>
      <mat-icon class="m-auto" style="font-size: 28px; line-height: 1;">account_circle</mat-icon>
    </ng-template>
  </div>

  <!-- Creative Studio -->
  <div matTooltip="Creative Studio" matTooltipPosition="right"
       class="relative md:mb-[10px] w-14 h-14 bg-blend-soft-light bg-white/40 rounded-[48px]
              shadow-[0px_4px_4px_0px_rgba(0,0,0,0.25)] outline outline-1 outline-offset-[-1px]
              outline-stone-300/80 backdrop-blur-2xl flex items-center justify-center overflow-hidden">
    <div *ngIf="router.isActive('/', true)"
         class="absolute inset-0 bg-gradient-to-r from-blue-500 via-violet-500 to-red-400 rounded-full blur-[3px] backdrop-blur-md"></div>

    <button routerLink="/" mat-mini-fab aria-label="Creative Studio" class="z-10 !w-9 !h-9 grid place-items-center">
      <mat-icon svgIcon="creative-studio-icon" class="!w-6 !h-6" style="font-size: 24px; line-height: 1;"></mat-icon>
    </button>
  </div>

  <!-- Video -->
  <div matTooltip="Video" matTooltipPosition="right"
       class="relative md:mb-[10px] w-14 h-14 bg-blend-soft-light bg-white/40 rounded-[48px]
              shadow-[0px_4px_4px_0px_rgba(0,0,0,0.25)] outline outline-1 outline-offset-[-1px]
              outline-stone-300/80 backdrop-blur-2xl flex items-center justify-center overflow-hidden">
    <div *ngIf="router.isActive('/video', true)"
         class="absolute inset-0 bg-gradient-to-r from-blue-500 via-violet-500 to-red-400 rounded-full blur-[3px] backdrop-blur-md"></div>

    <button routerLink="/video" mat-mini-fab aria-label="Video" class="z-10 !w-9 !h-9 grid place-items-center">
      <mat-icon fontIcon="movie_edit" class="!w-6 !h-6" style="font-size: 24px; line-height: 1;"></mat-icon>
    </button>
  </div>

  <!-- Virtual Try-On -->
  <div matTooltip="Virtual Try-On" matTooltipPosition="right"
       class="relative md:mb-[10px] w-14 h-14 bg-blend-soft-light bg-white/40 rounded-[48px]
              shadow-[0px_4px_4px_0px_rgba(0,0,0,0.25)] outline outline-1 outline-offset-[-1px]
              outline-stone-300/80 backdrop-blur-2xl flex items-center justify-center overflow-hidden">
    <div *ngIf="router.isActive('/vto', false)"
         class="absolute inset-0 bg-gradient-to-r from-blue-500 via-violet-500 to-red-400 rounded-full blur-[3px] backdrop-blur-md"></div>

    <button routerLink="/vto" mat-mini-fab aria-label="Virtual Try-On" class="z-10 !w-9 !h-9 grid place-items-center">
      <mat-icon class="!w-6 !h-6" style="font-size: 24px; line-height: 1;">checkroom</mat-icon>
    </button>
  </div>

  <!-- Media Gallery -->
  <div matTooltip="Media Gallery" matTooltipPosition="right"
       class="relative md:mb-[10px] w-14 h-14 bg-blend-soft-light bg-white/40 rounded-[48px]
              shadow-[0px_4px_4px_0px_rgba(0,0,0,0.25)] outline outline-1 outline-offset-[-1px]
              outline-stone-300/80 backdrop-blur-2xl flex items-center justify-center overflow-hidden">
    <div *ngIf="router.isActive('/gallery', false)"
         class="absolute inset-0 bg-gradient-to-r from-blue-500 via-violet-500 to-red-400 rounded-full blur-[3px] backdrop-blur-md"></div>

    <button routerLink="/gallery" mat-mini-fab aria-label="Media Gallery" class="z-10 !w-9 !h-9 grid place-items-center">
      <mat-icon fontIcon="bookmark_heart" class="!w-6 !h-6" style="font-size: 24px; line-height: 1;"></mat-icon>
    </button>
  </div>

  <!-- Fun Templates -->
  <div matTooltip="Fun Templates" matTooltipPosition="right"
       class="relative md:mb-[10px] w-14 h-14 bg-blend-soft-light bg-white/40 rounded-[48px]
              shadow-[0px_4px_4px_0px_rgba(0,0,0,0.25)] outline outline-1 outline-offset-[-1px]
              outline-stone-300/80 backdrop-blur-2xl flex items-center justify-center overflow-hidden">
    <div *ngIf="router.isActive('/fun-templates', true)"
         class="absolute inset-0 bg-gradient-to-r from-blue-500 via-violet-500 to-red-400 rounded-full blur-[3px] backdrop-blur-md"></div>

    <button routerLink="/fun-templates" mat-mini-fab aria-label="Fun Templates" class="z-10 !w-9 !h-9 grid place-items-center">
      <mat-icon svgIcon="fun-templates-icon" class="!w-6 !h-6" style="font-size: 24px; line-height: 1;"></mat-icon>
    </button>
  </div>

  <!-- Opal -->
  <div matTooltip="Opal" matTooltipPosition="right"
       class="relative md:mb-[10px] w-14 h-14 bg-blend-soft-light bg-white/40 rounded-[48px]
              shadow-[0px_4px_4px_0px_rgba(0,0,0,0.25)] outline outline-1 outline-offset-[-1px]
              outline-stone-300/80 backdrop-blur-2xl flex items-center justify-center overflow-hidden">
    <div *ngIf="router.isActive('/opal', true)"
         class="absolute inset-0 bg-gradient-to-r from-blue-500 via-violet-500 to-red-400 rounded-full blur-[3px] backdrop-blur-md"></div>

    <button routerLink="/opal" mat-mini-fab aria-label="Opal" class="z-10 !w-9 !h-9 grid place-items-center">
      <mat-icon svgIcon="flows-icon" class="!w-6 !h-6" style="font-size: 24px; line-height: 1;"></mat-icon>
    </button>
  </div>

  <!-- Admin (guarded) -->
  <div *ngIf="authService.isUserAdmin()" matTooltip="Admin" matTooltipPosition="right"
       class="relative md:mb-[10px] w-14 h-14 bg-blend-soft-light bg-white/40 rounded-[48px]
              shadow-[0px_4px_4px_0px_rgba(0,0,0,0.25)] outline outline-1 outline-offset-[-1px]
              outline-stone-300/80 backdrop-blur-2xl flex items-center justify-center overflow-hidden">
    <div *ngIf="router.isActive('/admin', false)"
         class="absolute inset-0 bg-gradient-to-r from-blue-500 via-violet-500 to-red-400 rounded-full blur-[3px] backdrop-blur-md"></div>

    <button routerLink="/admin" mat-mini-fab aria-label="Admin" class="z-10 !w-9 !h-9 grid place-items-center">
      <mat-icon class="!w-6 !h-6" style="font-size: 24px; line-height: 1;">admin_panel_settings</mat-icon>
    </button>
  </div>

  <!-- Logout -->
  <div matTooltip="Logout" matTooltipPosition="right"
       class="relative md:mb-[10px] w-14 h-14 bg-blend-soft-light bg-white/40 rounded-[48px]
              shadow-[0px_4px_4px_0px_rgba(0,0,0,0.25)] outline outline-1 outline-offset-[-1px]
              outline-stone-300/80 backdrop-blur-2xl flex items-center justify-center overflow-hidden">
    <button (click)="logout()" mat-mini-fab aria-label="Logout" class="z-10 !w-9 !h-9 grid place-items-center">
      <mat-icon class="!w-6 !h-6" style="font-size: 24px; line-height: 1;">exit_to_app</mat-icon>
    </button>
  </div>

</div>
