<div class="step-card virtual-try-on" [formGroup]="stepForm">
  <div class="step-header" (click)="isCollapsed = !isCollapsed">
    <div class="step-title">
      <mat-icon>accessibility_new</mat-icon>
      <span>Virtual Try-On</span>
      <span class="step-id-subtle">#{{ stepIndex + 1 }}</span>
    </div>
    <div class="step-actions">
      <button *ngIf="mode !== 'run'" mat-icon-button color="warn"
              (click)="$event.stopPropagation(); delete.emit()" matTooltip="Delete step">
        <mat-icon>delete</mat-icon>
      </button>
      <button mat-icon-button class="collapse-icon">
        <mat-icon>{{ isCollapsed ? 'expand_more' : 'expand_less' }}</mat-icon>
      </button>
    </div>
  </div>

  <div class="step-body" *ngIf="!isCollapsed">
    <div class="section inputs" formGroupName="inputs">
      <h3>Inputs</h3>
      <ng-container *ngFor="let field of ['model_image', 'top_image', 'bottom_image', 'dress_image', 'shoes_image']">
        <div class="input-group">
          <label>{{ field | titlecase }}</label>
          <div class="controls-row">
            <mat-form-field appearance="outline" class="mode-select">
              <mat-select [value]="inputModes[field]" (selectionChange)="toggleInputMode(field, $event.value)">
                <mat-option value="fixed">Fixed</mat-option>
                <mat-option value="linked">Link</mat-option>
              </mat-select>
            </mat-form-field>

            <mat-form-field *ngIf="inputModes[field] === 'fixed'" appearance="outline" class="value-input">
              <input matInput [formControlName]="field" placeholder="Image URL...">
            </mat-form-field>

            <mat-form-field *ngIf="inputModes[field] === 'linked'" appearance="outline" class="value-input">
              <mat-select [formControlName]="field">
                <mat-option>-- None --</mat-option>
                <mat-option *ngFor="let out of availableOutputs" [value]="{ step: out.step_id, output: out.output_key }">
                  {{ out.label }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </ng-container>
    </div>

    <div class="section settings" formGroupName="settings">
      <h3>Settings</h3>
      <div class="settings-grid">
         <mat-checkbox formControlName="save_output_to_gallery">Save to Gallery</mat-checkbox>
      </div>
    </div>

    <div class="section outputs">
      <h3>Outputs</h3>
      <div class="output-pill"><mat-icon>image</mat-icon> generated_image</div>
    </div>
  </div>
</div>
